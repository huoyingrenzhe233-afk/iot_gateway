<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RK3568 智能控制中心</title>
    <style>
        :root {
            --primary: #5c67f2;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --bg: #f0f2f5;
            --card: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 0 25px;
            border-radius: 16px;
            min-height: 60px;
            margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .status-tag {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        /* 主区域布局 */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 0;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1f2937;
        }

        /* 视频区域 - 保留原样式，仅替换内部为video标签 */
        .video-box {
            width: 100%;
            background: #000;
            border-radius: 12px;
            flex: 1;
            overflow: hidden;
            position: relative;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        /* 按钮通用 */
        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 13px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-cap {
            background: var(--success);
        }

        .btn-rec {
            background: var(--danger);
        }

        .btn-stream-start {
            background: var(--info);
        }

        .btn-stream-stop {
            background: #64748b;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* 控制面板 */
        .control-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #edf2f7;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: 600;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--primary);
        }

        .dir-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-dir {
            background: #e2e8f0;
            color: #64748b;
            padding: 6px;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-dir.active {
            background: #fff;
            color: var(--primary);
            border-color: var(--primary);
            font-weight: bold;
        }

        /* 开关手柄 */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--primary);
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        /* 日志窗口 - 填满剩余空间 */
        .log-container {
            background: #0f172a;
            color: #38bdf8;
            border-radius: 12px;
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            line-height: 1.5;
            border: 1px solid #1e293b;
        }

        .log-line {
            margin-bottom: 4px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 2px;
        }

        .log-time {
            color: #94a3b8;
            margin-right: 8px;
        }

        /* 底部传感器卡片 */
        .sensor-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .s-card {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        }

        .s-val {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            margin: 4px 0;
        }

        .s-unit {
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="header">
        <div style="font-size: 20px; font-weight: 800; letter-spacing: 1px;">RK3568 智能网关控制系统</div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <button id="channelBtn" class="btn" style="background: rgba(255,255,255,0.15); color:#fff; border:1px solid rgba(255,255,255,0.4); padding:6px 14px; border-radius:8px; cursor:pointer; font-size:13px;">📡 通道:MQTT</button>
            <div class="status-tag" id="conn_status">● 设备在线</div>
        </div>
    </div>

    <div class="main-grid">
        <!-- 左侧 -->
        <div class="column">
            <div class="card" style="flex: 1;">
                <div class="card-title">🎥 实时画面监控</div>
                <div class="video-box">
                    <!-- MJPEG 流:用 <img> 直连 mjpg-streamer 端口,全浏览器原生支持 -->
                    <img id="videoPlayer" alt="摄像头画面">
                </div>
                <div class="video-bar">
                    <button id="streamStartBtn" class="btn btn-stream-start">▶ 开始推流</button>
                    <button id="streamStopBtn" class="btn btn-stream-stop" disabled>⏹ 停止推流</button>
                    <button id="snapshotBtn" class="btn btn-cap">📸 抓拍照片</button>
                    <button id="recordBtn" class="btn btn-rec">🔴 视频录制</button>
                </div>
            </div>

            <div class="sensor-row">
                <div class="s-card">
                    <div>温度</div>
                    <div class="s-val" id="val_temp">--</div>
                    <div class="s-unit">°C</div>
                </div>
                <div class="s-card">
                    <div>湿度</div>
                    <div class="s-val" id="val_humi">--</div>
                    <div class="s-unit">% RH</div>
                </div>
                <div class="s-card">
                    <div>光照强度</div>
                    <div class="s-val" id="val_light">--</div>
                    <div class="s-unit">Lux</div>
                </div>
                <div class="s-card">
                    <div>红外检测</div>
                    <div class="s-val" id="val_ir" style="font-size:16px;">--</div>
                    <div class="s-unit">Status</div>
                </div>
            </div>
        </div>

        <!-- 右侧 -->
        <div class="column">
            <!-- 控制卡片 -->
            <div class="card">
                <div class="card-title">⚙️ 硬件外设控制</div>

                <div class="control-item">
                    <div class="label-row"><span>LED 照明灯</span><label class="switch"><input type="checkbox" id="led_sw"
                                onchange="updateLed()"><span class="slider"></span></label></div>
                    <input type="range" id="led_br" value="50" onchange="updateLed()">
                </div>

                <div class="control-item">
                    <div class="label-row"><span>直流电机控制</span><label class="switch"><input type="checkbox" id="motor_sw"
                                onchange="updateMotor()"><span class="slider"></span></label></div>
                    <input type="range" id="motor_sp" value="30" onchange="updateMotor()">
                    <div class="dir-btns">
                        <button id="dir_f" class="btn-dir active" onclick="setMotorDirUser(0)">正向旋转</button>
                        <button id="dir_r" class="btn-dir" onclick="setMotorDirUser(1)">反向旋转</button>
                    </div>
                </div>

                <div class="control-item" style="border-left: 4px solid var(--warning); margin-bottom: 0;">
                    <div class="label-row"><span>紧急蜂鸣报警</span><label class="switch"><input type="checkbox"
                                id="buzzer_sw" onchange="cmd('buzzer', this.checked?'on':'off')"><span
                                class="slider"></span></label></div>
                </div>
            </div>

            <!-- 日志卡片 -->
            <div class="card" style="flex: 1; min-height: 0;">
                <div class="card-title">📜 系统运行日志</div>
                <div class="log-container" id="log_box">
                    <div class="log-line"><span class="log-time">[00:00:00]</span>系统初始化完成...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== 视频流核心配置 ==========
        // MJPEG 流地址:mjpg-streamer 跑在 8080 端口,用 <img> 直接显示(零转码)
        const STREAM_URL = `http://${location.hostname}:8080/?action=stream`;
        const API_START_STREAM = '/api/camera/start_stream';
        const API_STOP_STREAM = '/api/camera/stop_stream';
        const API_START_RECORD = '/api/camera/start_record';
        const API_STOP_RECORD = '/api/camera/stop_record';
        const API_SNAPSHOT = '/api/camera/snapshot';

        // 全局状态
        let streamStarted = false;
        let recordStarted = false;

        // DOM元素
        const video = document.getElementById('videoPlayer');
        const streamStartBtn = document.getElementById('streamStartBtn');
        const streamStopBtn = document.getElementById('streamStopBtn');
        const snapshotBtn = document.getElementById('snapshotBtn');
        const recordBtn = document.getElementById('recordBtn');

        // MJPEG 流加载重试:mjpg_streamer 启动有 1~2 秒延迟(摄像头初始化),
        // 首帧可能"连接被拒",而 <img> 不会自动重试 → 必须手动重试
        let streamRetry = 0;
        let streamLoadTimer = null; // 启动流时的延迟加载定时器(stop 时清掉,防快速启停残留)
        video.onerror = () => {
            if (!streamStarted) return; // 已停止推流,不重试
            if (++streamRetry > 20) {
                addLog('❌ 视频流连接失败,请检查摄像头是否连接');
                return;
            }
            // 加时间戳参数强制浏览器重新发起请求(绕过缓存)
            setTimeout(() => { video.src = STREAM_URL + '?t=' + Date.now(); }, 1000);
        };

        let currentDir = 0;

        // 写入日志函数（增强，兼容视频流日志）
        function addLog(msg) {
            const box = document.getElementById('log_box');
            const time = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.className = 'log-line';
            // 用 DOM API(textContent)而非 innerHTML:防 msg 里的 <img onerror> 等注入执行(XSS)
            const timeSpan = document.createElement('span');
            timeSpan.className = 'log-time';
            timeSpan.textContent = `[${time}] `;
            line.appendChild(timeSpan);
            line.appendChild(document.createTextNode(msg));
            box.appendChild(line);
            // 日志行数上限:超 300 条删最旧,防长时间运行 DOM 无界增长
            while (box.children.length > 300) {
                box.removeChild(box.firstChild);
            }
            box.scrollTop = box.scrollHeight; // 自动滚动到底部
        }

        // 通用请求函数
        async function sendCommand(url, options = {}) {
            try {
                const res = await fetch(url, options);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            } catch (err) {
                addLog(`接口请求失败: ${err.message}`);
                console.error('API Error:', err);
                throw err;
            }
        }

        // ========== 视频流控制逻辑 ==========
        async function startStream() {
            if (streamStarted) return;
            try {
                addLog('正在启动视频流...');
                await sendCommand(API_START_STREAM);

                // 网关 fork mjpg_streamer 后,这里用 <img> 直连 MJPEG 流
                // (MJPEG 是所有浏览器原生支持的图片流,无需 Hls.js、无需转码)
                // ⚠️ mjpg_streamer 启动有 1~2 秒延迟,立即设 src 会"连接被拒"
                // 导致坏图标;延迟 1.5s 再加载,配合 onerror 自动重试兜底
                streamRetry = 0;
                streamLoadTimer = setTimeout(() => { video.src = STREAM_URL; }, 1500);
                addLog('✅ 视频流已启动(画面加载中...)');
                streamStarted = true;
                streamStartBtn.disabled = true;
                streamStopBtn.disabled = false;
            } catch (err) {
                addLog(`❌ 视频流启动失败: ${err.message}`);
            }
        }

        async function stopStream() {
            if (!streamStarted) return;
            try {
                addLog('正在停止视频流...');
                video.src = '';
                if (streamLoadTimer) { clearTimeout(streamLoadTimer); streamLoadTimer = null; }
                // 若正在录像,先停录像(录像依赖推流,先停可让 ffmpeg 正常收尾,避免留下损坏文件)
                if (recordStarted) {
                    try {
                        await sendCommand(API_STOP_RECORD);
                        recordStarted = false;
                        recordBtn.innerHTML = '🔴 视频录制';
                        addLog('⏹ 录像已随推流停止');
                    } catch (e) {
                        addLog(`⚠️ 停止录像出错: ${e.message}`);
                    }
                }
                await sendCommand(API_STOP_STREAM);

                streamStarted = false;
                streamStartBtn.disabled = false;
                streamStopBtn.disabled = true;
                addLog('⏹ 视频流已停止');
            } catch (err) {
                addLog(`⚠️ 停止视频流出错: ${err.message}`);
            }
        }

        async function takeSnapshot() {
            try {
                addLog('正在拍照...');
                await sendCommand(API_SNAPSHOT);
                addLog('✅ 拍照成功！照片已保存至 snapshots/');
            } catch (err) {
                addLog(`❌ 拍照失败: ${err.message}`);
            }
        }

        async function toggleRecord() {
            if (!streamStarted) {
                addLog('❌ 请先启动视频流再进行录像');
                return;
            }

            if (!recordStarted) {
                // 开始录像
                try {
                    addLog('正在启动录像...');
                    await sendCommand(API_START_RECORD);
                    recordStarted = true;
                    recordBtn.innerHTML = '⏹ 停止录制';
                    addLog('✅ 录像已开始');
                } catch (err) {
                    addLog(`❌ 录像启动失败: ${err.message}`);
                }
            } else {
                // 停止录像
                try {
                    addLog('正在停止录像...');
                    await sendCommand(API_STOP_RECORD);
                    recordStarted = false;
                    recordBtn.innerHTML = '🔴 视频录制';
                    addLog('✅ 录像已保存');
                } catch (err) {
                    addLog(`⚠️ 停止录像出错: ${err.message}`);
                }
            }
        }

      function cmd() {
    const payload = {
        led_on: document.getElementById('led_sw').checked ? 1 : 0,
        led_br: parseInt(document.getElementById('led_br').value),
        motor_on: document.getElementById('motor_sw').checked ? 1 : 0,
        motor_sp: parseInt(document.getElementById('motor_sp').value),
        motor_dir: currentDir,  
        buzzer: document.getElementById('buzzer_sw').checked ? 1 : 0
    };

    const msg = {
        type: "control",
        payload: payload
    };

    addLog(`发送指令: ${JSON.stringify(msg)}`);

    fetch('/api/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(msg)
    }).then(async res => {
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.message || `HTTP ${res.status}`);
        }
        return res.json();
    }).catch(err => {
        addLog(`❌ 指令发送失败: ${err.message}`);
    });
}


        function updateLed() {
            const sw = document.getElementById('led_sw').checked ? '开启' : '关闭';
            const br = document.getElementById('led_br').value;
            addLog(`LED调整: ${sw}, 亮度 ${br}%`);
            cmd();
        }

        function setMotorDirUI(dir) {
    currentDir = dir;

    document.getElementById('dir_f').classList.toggle('active', dir === 0);
    document.getElementById('dir_r').classList.toggle('active', dir === 1);
}

function setMotorDirUser(dir) {
    setMotorDirUI(dir);
    addLog(`电机方向切换: ${dir === 0 ? '正转' : '反转'}`);
    cmd();   // ✅ 只有用户操作才发
}



        function updateMotor() {
    const sw = document.getElementById('motor_sw').checked ? '开启' : '关闭';
    const sp = document.getElementById('motor_sp').value;

    cmd();

    addLog(
        `电机控制: ${sw}, 速度 ${sp}%, 方向 ${currentDir === 0 ? '正转' : '反转'}`
    );
}
        // ========== 事件绑定 ==========
        // 视频流按钮绑定
        streamStartBtn.onclick = startStream;
        streamStopBtn.onclick = stopStream;
        snapshotBtn.onclick = takeSnapshot;
        recordBtn.onclick = toggleRecord;

        // 定时拉取传感器数据(带 in-flight 保护,防响应慢时请求堆积乱序)
        let polling = false;
        setInterval(() => {
            if (polling) return; // 上一次还没返回,跳过本次
            polling = true;
            fetch('/api/status').then(r => r.json()).then(data => {
                // 渲染传感器数据
                document.getElementById('val_temp').innerText = data.temp || '--';
                document.getElementById('val_humi').innerText = data.humi || '--';
                document.getElementById('val_light').innerText = data.light || '--';
                const irBox = document.getElementById('val_ir');
                const irDetected = Number(data.ir) > 2000;
                irBox.innerText = irDetected ? "☢ 有人" : "安全";
                irBox.style.color = irDetected ? "var(--danger)" : "var(--success)";

                // 同步硬件状态到前端控件
                // 滑杆回写前检查焦点:用户正在拖动时跳过,否则一次带旧值的
                // 轮询返回会把滑杆"拽回去"(本地操作 vs 轮询竞态)
                const ledBrEl = document.getElementById('led_br');
                const motorSpEl = document.getElementById('motor_sp');
                document.getElementById('led_sw').checked = data.led_on === 1;
                if (document.activeElement !== ledBrEl) ledBrEl.value = data.led_br ?? 50;
                document.getElementById('motor_sw').checked = data.motor_on === 1;
                if (document.activeElement !== motorSpEl) motorSpEl.value = data.motor_sp ?? 30;
                setMotorDirUI(data.motor_dir);
                document.getElementById('buzzer_sw').checked = data.buzzer === 1;

                // 恢复连接状态
                document.getElementById('conn_status').innerText = "● 设备在线";
                document.getElementById('conn_status').style.color = "#fff";
            }).catch(e => {
                document.getElementById('conn_status').innerText = "● 连接断开";
                document.getElementById('conn_status').style.color = "#ff4d4d";
                addLog(`传感器数据获取失败: ${e.message}`);
            }).finally(() => {
                polling = false;
            });
        }, 1000);

        // ========== WebSocket:MQTT 消息实时推送到日志 ==========
        // 网关收到单片机 MQTT 上报后,会主动推 {"type":"mqtt_msg",...} 给所有
        // 连接的 WS 客户端;这里收到就写进日志窗口(实时,不用轮询)
        function connectWs() {
            const wsUrl = `ws://${location.hostname}:${location.port || 8081}/ws`;
            const ws = new WebSocket(wsUrl);
            ws.onmessage = (ev) => {
                try {
                    const msg = JSON.parse(ev.data);
                    if (msg.type === 'mqtt_msg') {
                        addLog(`📡 MQTT ${msg.topic}: ${msg.payload}`);
                    } else if (msg.type === 'channel' &&
                               (msg.transport === 'mqtt' || msg.transport === 'zigbee')) {
                        // 别端(或本端)切换了通道:按钮立即同步,不再只靠页面加载时查一次
                        updateChannelBtn(msg.transport);
                    }
                } catch (e) {
                    // 非 JSON 消息忽略
                }
            };
            ws.onopen = () => addLog('🔌 WebSocket 已连接(实时推送)');
            ws.onclose = () => setTimeout(connectWs, 3000); // 断线 3s 后重连
        }
        connectWs();

        // ========== 通信通道切换(MQTT/ZigBee 双通道) ==========
        const channelBtn = document.getElementById('channelBtn');
        let currentTransport = 'mqtt';

        function updateChannelBtn(t) {
            currentTransport = t;
            channelBtn.innerText = t === 'zigbee' ? '📡 通道:ZigBee' : '📡 通道:MQTT';
        }

        async function toggleChannel() {
            const target = currentTransport === 'mqtt' ? 'zigbee' : 'mqtt';
            try {
                const res = await fetch('/api/channel/switch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transport: target })
                });
                const data = await res.json();
                if (data.ok) {
                    updateChannelBtn(target);
                    addLog(`🔄 已切换到 ${target === 'zigbee' ? 'ZigBee' : 'MQTT'} 通道`);
                } else {
                    addLog(`⚠️ 切换失败: ${data.message || '通道未就绪'}`);
                }
            } catch (err) {
                addLog(`⚠️ 切换失败: ${err.message}`);
            }
        }
        channelBtn.onclick = toggleChannel;

        // 启动时查询当前通道,同步按钮显示
        fetch('/api/channel').then(r => r.json()).then(d => {
            if (d.transport) updateChannelBtn(d.transport);
        }).catch(() => {});

        // 启动时同步摄像头状态:页面刷新后 streamStarted/recordStarted 会清零,
        // 但网关侧的推流/录像可能还在跑——若不同步,用户再点"启动"会被网关
        // 拒绝并误报"启动失败"。这里把按钮状态对齐真实状态。
        fetch('/api/camera/status').then(r => r.json()).then(d => {
            streamStarted = !!d.running;
            recordStarted = !!d.recording;
            streamStartBtn.disabled = streamStarted;
            streamStopBtn.disabled = !streamStarted;
            recordBtn.innerHTML = recordStarted ? '⏹ 停止录制' : '🔴 视频录制';
            if (d.running) addLog('📹 视频流已在运行(已同步状态)');
        }).catch(() => {});

        // 初始化日志
        addLog('[系统] 页面加载完成，设备控制就绪');
    </script>

</body>

</html>
