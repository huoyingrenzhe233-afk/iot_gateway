# 规则引擎规则
# ⚠️ sensor/actuator 的 id 必须与 config/devices/*.yaml 的 id 一致
# 边沿触发:条件从不满足变满足的瞬间触发一次动作(恢复规则负责回退)
#
# LED 规则用回滞带(实测读数:亮 ~2500,遮光 ~1400):
#   暗光开灯:读数 < 1500 时开灯
#   亮光关灯:读数 >= 2200 时关灯
#   中间 1500~2200 是死区:读数在死区内两条规则都不动作,灯保持现状,
#   防止遮光过程中读数在阈值附近抖动导致灯来回闪。
rules:
  - id: temp_alarm
    name: 高温报警
    enabled: true
    when:
      sensor: temp_1
      op: ">"
      value: 30
    then:
      actuator: buzzer_1
      field: buzzer
      value: 1
  - id: temp_alarm_off
    name: 高温解除
    enabled: true
    when:
      sensor: temp_1
      op: "<="
      value: 30
    then:
      actuator: buzzer_1
      field: buzzer
      value: 0
  - id: dark_led_on
    name: 暗光开灯
    enabled: true
    when:
      sensor: light_1
      op: "<"
      value: 1500
    then:
      actuator: led_1
      field: led_on
      value: 1
  - id: bright_led_off
    name: 亮光关灯
    enabled: true
    when:
      sensor: light_1
      op: ">="
      value: 2200
    then:
      actuator: led_1
      field: led_on
      value: 0
