# 规则引擎规则
# ⚠️ sensor/actuator 的 id 必须与 config/devices/*.yaml 的 id 一致
# 边沿触发:条件从不满足变满足的瞬间触发一次动作(恢复规则负责回退)
#
# 🔑 防震荡三板斧(暗光开灯类规则的必修课):
#   1. 回滞带:开灯阈值和关灯阈值必须错开(本例 <1500 开 / >=2300 关,
#      中间 1500~2300 是"死区",读数在死区内两条规则都不动作,灯保持现状);
#   2. cooldown:触发后 15 秒内同一条规则休眠,即使读数反复穿越阈值也
#      不会快速来回下发;
#   3. 物理:LED 与光敏传感器之间尽量遮光——LED 的光漏回传感器会把读数
#      抬高,与回滞带/冷却叠加仍然震荡时,先查这条(遮光时开灯后的读数
#      若 >= 2300 说明漏光太强,需调整遮挡方式或传感器位置)。
#
# 实测参考(板子):无遮挡 ~2450;完全遮光 ~1000。
rules:
  - id: temp_alarm
    name: 高温报警
    enabled: true
    when:
      sensor: temp_1
      op: ">"
      value: 30
    then:
      actuator: buzzer_1
      field: buzzer
      value: 1
  - id: temp_alarm_off
    name: 高温解除
    enabled: true
    when:
      sensor: temp_1
      op: "<="
      value: 30
    then:
      actuator: buzzer_1
      field: buzzer
      value: 0
  - id: dark_led_on
    name: 暗光开灯
    enabled: true
    when:
      sensor: light_1
      op: "<"
      value: 1500
    then:
      actuator: led_1
      field: led_on
      value: 1
    cooldown: 15
  - id: bright_led_off
    name: 亮光关灯
    enabled: true
    when:
      sensor: light_1
      op: ">="
      value: 2300
    then:
      actuator: led_1
      field: led_on
      value: 0
    cooldown: 15
